<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DineFlow | Cart</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=shopping_cart" />
</head>
<body class="min-h-screen flex flex-col">
    <header class="border-b-1 border-b-[var(--text-grey)] sticky top-0 z-50 bg-slate-50/96 px-3">
        <div class="max-w-7xl mx-auto min-h-20 flex flex-wrap justify-between items-center">
            <div class="logo">
                <a href="../index.html" class="font-bold text-2xl md:text-3xl">Dine<span class="text-[var(--primary-color)]">Flow</span></a>
            </div>
            <nav id="navMenu" class="nav-items hidden md:flex flex-col md:flex-row gap-5 lg:gap-8 absolute md:static top-20 left-0 w-full md:w-auto bg-slate-50/96 md:bg-transparent text-center py-5">
                <a href="../index.html">Home</a>
                <a href="./menu.html">Menu</a>
                <a href="./about.html">About</a>
                <a href="./contact.html">Contact</a>
            </nav>
            <div class="flex gap-4 items-center justify-center">
                <div class="text-gray-500 size-10 p-3 flex items-center justify-center hover:bg-orange-100 rounded-full transition duration-150 relative">
                    <div id="cartCountBadge" class="hidden absolute -top-1 right-0  size-4 flex justify-center items-center bg-orange-600 text-xs rounded-full p-2 text-white font-semibold">
                        <span id="cart-items-count"></span>
                    </div>
                    <span class="material-symbols-outlined "><a href="./cart.html">shopping_cart</a></span>
                </div>
                <div class="profile-user size-10 rounded-full bg-[var(--primary-color)] flex justify-center items-center border-3 border-yellow-500 hover:opacity-86 hover:cursor-pointer">
                    <a href="./dashboard.html"><p class="font-semibold text-white">AR</p></a>
                </div>
                <button id="menuBtn" class="md:hidden text-2xl">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </div>
        </div>
    </header>
    <main class="bg-slate-100 flex-1">
        <div class="max-w-7xl mx-auto p-4">
            <div class="flex gap-2 items-baseline py-4">
                <h2 class="font-bold text-2xl ">Your Cart</h2>
                <span class="text-gray-600 ">(<span id="cartCount">0</span> items)</span>
            </div>
            <div id="cart-container" class="flex flex-col border border-slate-200 rounded-xl overflow-hidden bg-white shadow-sm">
            </div>
            <div class="flex flex-col md:flex-row justify-between gap-8 my-8">
                <a href="./menu.html" class="flex items-end gap-2 text-gray-600 hover:text-orange-600 font-medium transition duration-200">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Continue Ordering</span>
                </a>
                <div id="order-summary" class="hidden w-full sm:w-1/2 lg:w-1/3 space-y-3">
                    <div class="flex justify-between text-gray-700">
                        <span>Subtotal</span>
                        <span id="cart-subtotal" class="text-gray-900"></span>
                    </div>
                    <div class="flex justify-between text-gray-700">
                        <span>Delivery Charges</span>
                        <span id="delivery-charge" class="text-gray-900">₹40</span>
                    </div>
                    <div class="flex justify-between border-t border-slate-200 py-3 font-bold text-lg ">
                        <span>Total</span>
                        <span id="cart-total"></span>
                    </div>
                    <button id="checkoutBtn" class="w-full px-3 text-sm md:text-base bg-orange-600 hover:bg-orange-700 text-white font-semibold py-3 rounded-lg transition duration-200">Proceed to Checkout</button>
                </div>
            </div>
        </div>
    </main>
    <footer class="bg-[var(--secondary-color)] text-white ">
        <div class="max-w-7xl mx-auto px-3 py-8 grid grid-cols-1 md:grid-cols-3 gap-7">
            <div class="footer-logo">
                <a href="../index.html" class="font-bold text-xl">Dine<span class="text-[var(--primary-color)]">Flow</span></a>
                <p class="text-gray-300 text-sm pt-3">Order. Dine. Enjoy.</p>
            </div>
            <div class="footer-nav flex flex-col gap-2">
                <h4 class="font-medium text-lg pb-3">Quick Links</h4>
                <a href="../index.html">Home</a>
                <a href="./menu.html">Menu</a>
                <a href="./about.html">About</a>
                <a href="./contact.html">Contact</a>
            </div>
            <div class="footer-contact">
                <h4 class="font-medium text-lg pb-3">Contact Us</h4>
                <div class="flex flex-col gap-3">
                    <div class="flex items-center gap-4">
                        <i class="fa-solid fa-phone text-[var(--primary-color)]"></i>
                        <span>+91 907272345</span>
                    </div>
                    <div class="flex items-center gap-4">
                        <i class="fa-solid fa-envelope text-[var(--primary-color)]"></i>
                        <span>dineflow@gmail.com</span>
                    </div>
                    <div class="flex items-center gap-4">
                        <i class="fa-solid fa-location-dot text-[var(--primary-color)]"></i>
                        <span>Bangalore, India</span>
                    </div>
                    <div class="flex gap-4 mt-3">
                        <a href="#" class="w-6 h-6 rounded-full bg-slate-800 flex justify-center items-center p-4">
                            <i class="fa-brands fa-facebook-f"></i>
                        </a>
                        <a href="" class="w-6 h-6 rounded-full bg-slate-800 flex justify-center items-center p-4">
                            <i class="fa-brands fa-instagram"></i>
                        </a>
                        <a href="#" class="w-6 h-6 rounded-full bg-slate-800 flex justify-center items-center p-4">
                            <i class="fa-brands fa-youtube"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
        <div class="max-w-7xl mx-auto border-t-1 border-slate-700 text-center py-4 flex items-center justify-center">
            <p class="text-xs text-gray-400 font-extralight">© 2026 DineFlow. All rights reserved.</p>
        </div>
    </footer>
    <script src="../js/cart.js"></script>
    <script src="../js/index.js"></script>
</body>
</html>
